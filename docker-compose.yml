# Local testing of the containerised build.
#   docker compose up --build          -> http://localhost:8080/
#   docker compose --profile prod up --build  -> http://localhost:8081/zoombackgroundgenerator/
#
# For day-to-day development use `npm run dev` instead — it has hot reload.

services:
  zoombackgroundgenerator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zoombackgroundgenerator
    ports:
      - "8080:80"
    restart: always

  zoombackgroundgenerator-prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: zoombackgroundgenerator-prod
    ports:
      - "8081:80"
    restart: always
