# Serves the app under /zoombackgroundgenerator/ (matches vite's `base`).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 302 /zoombackgroundgenerator/;
    }

    location = /zoombackgroundgenerator {
        return 301 /zoombackgroundgenerator/;
    }

    location /zoombackgroundgenerator/ {
        try_files $uri $uri/ /zoombackgroundgenerator/index.html;
    }

    # Vite fingerprints these filenames, so they can be cached indefinitely.
    location /zoombackgroundgenerator/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /zoombackgroundgenerator/index.html;
    }
}
